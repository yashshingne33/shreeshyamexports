[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every path serves the app (fixes 404 on refresh / deep links).
# Netlify Forms POSTs are handled before redirects, so the enquiry form is unaffected.
[[redirects]]
  from = "/guides/"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

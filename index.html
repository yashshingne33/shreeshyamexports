<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coconut Charcoal and Activated Carbon Exporter | Shri Shyam Exports</title>
    <meta name="description" content="India-based merchant exporter of coconut charcoal products and coconut shell activated carbon for international buyers. Request an export quote." />
  </head>
  <body class="bg-ivory font-body text-charcoal antialiased">
    <!-- Netlify Forms detection: keep these field names in sync with src/components/RfqForm.jsx (FIELDS). -->
    <form name="export-enquiry" data-netlify="true" netlify-honeypot="bot-field" encType="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="reference" /><input name="source_page" /><input name="enquiry_type" />
      <input name="name" /><input name="company" /><input name="email" /><input name="phone" /><input name="country" />
      <input name="products" /><input name="quantity" /><input name="destination_port" /><input name="frequency" />
      <input name="shipment_window" /><input name="trade_term" /><input name="packaging" />
      <input name="fuel_shape_dimensions" /><input name="fuel_ash_moisture" /><input name="fuel_use" />
      <input name="carbon_form" /><input name="carbon_mesh" /><input name="carbon_application" /><input name="carbon_iodine_bet" /><input name="carbon_certification" />
      <textarea name="message"></textarea>
      <input name="consent" /><input name="marketing_consent" />
      <input type="file" name="attachment_1" /><input type="file" name="attachment_2" /><input type="file" name="attachment_3" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
